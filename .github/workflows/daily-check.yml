name: Daily Website Check

on:
  schedule:
    # 10:00 AM IST is 04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  check-websites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily check
        run: npm run console
